name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The repo gitignores its lockfile, so `npm ci` / cache: npm cannot be used.
      - run: npm install
      - run: npm run build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The repo gitignores its lockfile, so `npm ci` / cache: npm cannot be used.
      - run: npm install
      - run: npx vitest run --passWithNoTests
